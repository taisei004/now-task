<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f8fa" />
    <meta name="description" content="メモ、次のタスク、10分の集中。" />
    <link rel="icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Now — タスク</title>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-label="読み込み中" aria-busy="true">
        <div class="boot-header"></div>
        <div class="boot-capture"></div>
        <div class="boot-columns">
          <div></div>
          <div></div>
        </div>
      </div>
    </div>
    <style>
      .boot {
        max-width: 1120px;
        min-height: 100svh;
        margin: 0 auto;
        padding: 40px 56px;
      }
      .boot .boot-header {
        height: 36px;
        width: 100px;
        margin-bottom: 80px;
      }
      .boot .boot-capture {
        height: 180px;
      }
      .boot .boot-columns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 32px;
        background: none;
        height: auto;
      }
      .boot .boot-columns > div {
        height: 310px;
        margin: 0;
      }
      .boot div:nth-child(2) {
        height: 180px;
      }
      @media (max-width: 760px) {
        .boot {
          padding: 30px 23px;
        }
        .boot .boot-header {
          margin-bottom: 50px;
        }
        .boot .boot-columns {
          grid-template-columns: 1fr;
          gap: 30px;
        }
      }
      .boot div {
        height: 100px;
        border-radius: 28px;
        margin: 24px 0;
        background: linear-gradient(
          100deg,
          #f0f1f4 20%,
          #fafbfc 40%,
          #f0f1f4 60%
        );
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
      }
      @keyframes shimmer {
        to {
          background-position: -200% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot div {
          animation: none;
        }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
